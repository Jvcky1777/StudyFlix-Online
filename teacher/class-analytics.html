<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Analytics - Classroom Live</title>
    <link rel="stylesheet" href="../src/css/global.css">
    <link rel="stylesheet" href="../src/css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  </head>
  <body>
    
    <div class="dashboard-layout">
      <!-- INSTRUCTOR SIDEBAR -->
      <nav class="sidebar" id="main-sidebar">
        <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; padding-right: 10px;">
          <h2 class="glow-text nav-text" style="font-size: 1.5rem; margin-bottom: 0; padding-left: 15px; white-space: nowrap;">Host Menu</h2>
          <button id="sidebar-toggle" style="background: transparent; border: none; box-shadow: none; color: var(--neon-cyan); font-size: 1.4rem; width: auto; padding: 0; margin: 0; cursor: pointer;">
            <i class="fa-solid fa-bars-staggered"></i>
          </button>
        </div>
        
        <a href="./teacher-dashboard.html" class="nav-item">
          <i class="fa-solid fa-gamepad"></i> <span class="nav-text">Command Center</span>
        </a>
        <a href="#" id="openScheduleModalBtn" class="nav-item">
          <i class="fa-solid fa-calendar-plus"></i> <span class="nav-text">Schedule Classes</span>
        </a>
        <a href="#" class="nav-item">
          <i class="fa-solid fa-folder-open"></i> <span class="nav-text">Upload Resources</span>
        </a>
        <a href="./class-analytics.html" class="nav-item active">
          <i class="fa-solid fa-chart-simple"></i> <span class="nav-text">Student Analytics</span>
        </a>
        <a href="#" class="nav-item">
          <i class="fa-solid fa-gear"></i> <span class="nav-text">Settings</span>
        </a>
        
        <div style="margin-top: auto;">
          <button onclick="logoutUser()" style="display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px 0;">
            <i class="fa-solid fa-right-from-bracket"></i> <span class="nav-text">Log Out</span>
          </button>
        </div>
      </nav>

      <!-- MAIN CONTENT -->
      <main class="dashboard-main">
        <div class="top-bar">
          <input type="text" class="search-bar" placeholder="Search analytics...">
          <div class="profile-chip">
            <div class="avatar" id="userInit" style="background: var(--neon-purple);">?</div>
            <span id="topBarName" style="font-weight: 500;">Loading...</span>
          </div>
        </div>

        <h1 class="glow-text" style="text-align: left; margin-bottom: 1rem;">Student Analytics</h1>
        <p style="color: var(--text-muted); margin-bottom: 2rem;">Track attendance and participation across all your past live sessions.</p>

        <!-- Dynamic Data Grid -->
        <div class="card-grid" id="analytics-grid">
          <!-- JS will populate this -->
        </div>

      </main>
    </div>
    
    <script type="module" src="../src/js/session.js"></script>
    <script type="module" src="../src/js/teacher_d.js"></script>
  </body>
</html>
