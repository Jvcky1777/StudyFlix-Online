<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Room - Classroom Live</title>
    <link rel="stylesheet" href="../src/css/global.css">
    <link rel="stylesheet" href="../src/css/classroom.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  </head>
  <body>
    
    <div class="classroom-container">

      <!-- MAIN VIDEO AREA -->
      <div class="video-stage">
        
        <!-- Top Info Bar (Overlay) -->
        <div style="position: absolute; top: 20px; left: 20px; z-index: 10;">
            <button class="back-btn" onclick="window.location.href='./dashboard.html'" style="text-shadow: 0 2px 4px rgba(0,0,0,0.8); margin-bottom: 10px;">
                ← Back to Dashboard
            </button>
          
            <!-- The Recording Tag and Title -->
            <div style="display: flex; align-items: center;">
                <div class="tag live">● REC</div>
                <span style="margin-left: 10px; font-weight: bold; text-shadow: 0 2px 4px rgba(0,0,0,0.8);">Java Web Apps & Multithreading</span>
            </div>
        
        </div>

        <!-- The Split Video Layout -->
        <div class="video-layout">
          
          <!-- MAIN STAGE: Instructor (Injected by JS) -->
          <div class="main-stage" id="main-stage-container">
             <!-- Javascript will drop the Teacher's card here! -->
          </div>

          <!-- PARTICIPANT STRIP: Students -->
          <fieldset style="border: 1px solid rgba(0, 243, 255, 0.3); border-radius: 8px; padding: 25px 20px 20px 20px; margin-top: 20px; width: 100%; box-sizing: border-box;">
            <legend style="color: var(--neon-cyan); padding: 0 10px; font-size: 0.85rem; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; margin-left: 10px;">Participants</legend>
            <div class="participant-strip" id="participant-strip-container">
              
              <!-- Student's Local Video -->
              <div class="video-cell" id="local-video-wrapper" style="position: relative;">
                <div id="local-placeholder" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #1a1a1a; z-index: 2; border-radius: inherit;">
                  <div id="local-avatar" class="avatar" style="width: 80px; height: 80px; font-size: 2.5rem; margin-bottom: 15px; background: var(--neon-purple); display: flex; align-items: center; justify-content: center; border-radius: 50%; color: white;">?</div>
                  <h3 id="local-name" style="color: white; margin: 0; font-size: 1.2rem;">Loading...</h3>
                  <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 5px;">Camera is off</p>
                </div>
                <video id="local-video" autoplay playsinline muted style="width: 100%; height: 100%; object-fit: cover;"></video>
                <div class="video-nameplate">You</div>
              </div>

            </div>
          </fieldset>

        </div>

        <!-- Bottom Controls -->
        <div class="control-bar">
          <!-- Mic Button (Starts Muted/White) -->
          <button class="control-btn" id="toggle-mic-btn" title="Toggle Microphone" style="color: white;">
            <i class="fa-solid fa-microphone-slash"></i>
          </button>

          <!-- Camera Button (Starts Off/White) -->
          <button class="control-btn" id="toggle-camera-btn" title="Toggle Camera" style="color: white;">
            <i class="fa-solid fa-video-slash"></i>
          </button>

          <!-- Screen Share Button (Starts Off/White) -->
          <button class="control-btn" id="share-screen-btn" title="Share Screen" style="color: white;">
            <i class="fa-solid fa-display"></i>
          </button>
          <button class="control-btn" id="raise-hand-btn" title="Raise Hand" style="color: white;">
            <i class="fa-solid fa-hand"></i>
          </button>

          <button class="control-btn danger" id="leave-room-btn" title="Leave Classroom">
            <i class="fa-solid fa-right-from-bracket"></i>
          </button>
        </div>

      </div>

      <!-- SIDE CHAT & PARTICIPANTS -->
      <div class="chat-sidebar">
        <div class="chat-header">
          <h3 class="glow-text" style="text-align: left; margin: 0; font-size: 1.2rem;">Class Chat</h3>
        </div>
        
        <div class="chat-messages" id="chat-feed">
          <!-- Real messages will inject here -->
        </div>

        <div class="chat-input-area">
          <form id="chat-form" style="flex-direction: row; gap: 0.5rem;" onsubmit="event.preventDefault();">
            <input type="text" id="chat-input" placeholder="Type a message..." style="flex: 1; padding: 10px; font-size: 0.9rem;">
            <button type="submit" style="width: auto; margin: 0; padding: 10px 15px;">Send</button>
          </form>
        </div>
      </div>

    </div>

    <script type="module">
      import { toggleCamera, joinClassroom, leaveClassroom, toggleScreenShare, toggleMicrophone, toggleHandRaise } from '../src/js/video-stream.js';
      import { sendMessage, listenForMessages } from '../src/js/live-chat.js';
      import { auth, db } from '../src/js/firebase.js';
      import { onAuthStateChanged } from "firebase/auth";
      import { doc, getDoc } from "firebase/firestore";

      document.addEventListener('DOMContentLoaded', async () => {
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');

        if (!roomId) {
          alert("Error: Missing Room ID. Returning to dashboard.");
          window.location.href = './dashboard.html';
          return;
        }

        // 1. FETCH IDENTITY -> JOIN ROOM & WIRE CHAT
        onAuthStateChanged(auth, async (user) => {
          if (user) {
            const userDoc = await getDoc(doc(db, "users", user.uid));
            if (userDoc.exists()) {
              const firstName = userDoc.data().first_name;
              document.getElementById('local-name').textContent = firstName;
              document.getElementById('local-avatar').textContent = firstName.charAt(0).toUpperCase();

              // Join Room and Trigger Chat Listener
              joinClassroom(roomId, user.uid, firstName).then(() => {
                listenForMessages(roomId);
              }).catch(console.error);

              // WIRE UP CHAT SUBMIT
              const chatForm = document.getElementById('chat-form');
              const chatInput = document.getElementById('chat-input');
              if (chatForm && chatInput) {
                chatForm.addEventListener('submit', async (e) => {
                  e.preventDefault();
                  const text = chatInput.value;
                  if (text) {
                    await sendMessage(roomId, text, firstName, 'student');
                    chatInput.value = ''; // Clear input field
                  }
                });
              }
            }
          }
        });

        // ==========================================
        // 2. CAMERA TOGGLE LOGIC
        // ==========================================
        const cameraBtn = document.getElementById('toggle-camera-btn');
        const placeholder = document.getElementById('local-placeholder');

        if (cameraBtn) {
          cameraBtn.addEventListener('click', async () => {
            const isCameraOn = await toggleCamera();
            const icon = cameraBtn.querySelector('i');
            
            placeholder.style.display = isCameraOn ? 'none' : 'flex';
            cameraBtn.style.color = isCameraOn ? "var(--neon-cyan)" : "white";
            
            // Swap Font Awesome classes
            if (isCameraOn) {
              icon.classList.replace('fa-video-slash', 'fa-video');
            } else {
              icon.classList.replace('fa-video', 'fa-video-slash');
            }
          });
        }

        // ==========================================
        // 3. MICROPHONE TOGGLE LOGIC
        // ==========================================
        const micBtn = document.getElementById('toggle-mic-btn');

        if (micBtn) {
          micBtn.addEventListener('click', async () => {
            const isMicOn = await toggleMicrophone();
            const icon = micBtn.querySelector('i');
            
            if (isMicOn !== null) {
              micBtn.style.color = isMicOn ? "var(--neon-cyan)" : "white";
              
              // Swap Font Awesome classes
              if (isMicOn) {
                icon.classList.replace('fa-microphone-slash', 'fa-microphone');
              } else {
                icon.classList.replace('fa-microphone', 'fa-microphone-slash');
              }
            }
          });
        }

        // ==========================================
        // 4. SCREEN SHARE TOGGLE LOGIC
        // ==========================================
        const shareBtn = document.getElementById('share-screen-btn');
        if (shareBtn) {
          shareBtn.addEventListener('click', async () => {
            const isSharing = await toggleScreenShare();
            // The display icon stays the same, just glows cyan
            shareBtn.style.color = isSharing ? "var(--neon-cyan)" : "white";
          });
        }

        // 4. RAISE HAND TOGGLE
        // RAISE HAND TOGGLE
        const handBtn = document.getElementById('raise-hand-btn');
        if (handBtn) {
          handBtn.addEventListener('click', async () => {
            const isRaised = await toggleHandRaise();
            if (isRaised !== null) {
              // Highlight the button cyan when the hand is currently raised
              handBtn.style.color = isRaised ? "var(--neon-cyan)" : "white";
              handBtn.style.boxShadow = isRaised ? "var(--glow-cyan)" : "none";
              handBtn.style.border = isRaised ? "1px solid var(--neon-cyan)" : "none";
            }
          });
        }


        // LEAVE ROOM
        const leaveBtn = document.getElementById('leave-room-btn');
        if (leaveBtn) {
          leaveBtn.addEventListener('click', async () => {
            await leaveClassroom();
            window.location.href = './dashboard.html';
          });
        }


       
      });
    </script>

  </body>
</html>
